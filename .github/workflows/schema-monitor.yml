name: API Schema Monitor

on:
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      create_issue:
        description: 'Create GitHub issue if changes detected'
        required: false
        default: 'true'

jobs:
  monitor-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    # Required secrets: HYDROQC_USERNAME, HYDROQC_PASSWORD
    # Rate plan is auto-detected from the contract after login
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history for schema archive
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Create schemas directory
        run: |
          mkdir -p schemas/archive
          mkdir -p schemas/latest
      
      - name: Extract current schemas
        id: extract
        env:
          HYDROQC_0_USERNAME: ${{ secrets.HYDROQC_USERNAME }}
          HYDROQC_0_PASSWORD: ${{ secrets.HYDROQC_PASSWORD }}
        run: |
          python scripts/extract_schemas.py \
            --output schemas/latest/api_schemas.json \
            --archive schemas/archive
        continue-on-error: true
      
      - name: Check if extraction succeeded
        if: steps.extract.outcome == 'failure'
        run: |
          echo "::warning::Schema extraction failed - cannot compare"
          exit 0
      
      - name: Compare with previous schema
        id: compare
        run: |
          if [ -f schemas/latest/api_schemas.json ]; then
            python scripts/compare_schemas.py \
              --previous schemas/archive \
              --current schemas/latest/api_schemas.json \
              --create-issue \
              --verbose
            echo "comparison_exit_code=$?" >> $GITHUB_OUTPUT
          else
            echo "::warning::No current schema file found"
            echo "comparison_exit_code=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Upload schemas as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-schemas-${{ github.run_number }}
          path: |
            schemas/latest/api_schemas.json
            schemas/archive/*.json
          retention-days: 90
      
      - name: Commit schema changes
        if: steps.extract.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schemas/
          if git diff --staged --quiet; then
            echo "No schema changes to commit"
          else
            git commit -m "chore: update API schemas [skip ci]"
            git push
          fi
        continue-on-error: true
      
      - name: Create issue for breaking changes
        if: |
          steps.compare.outputs.comparison_exit_code == '2' &&
          (github.event_name == 'schedule' || github.event.inputs.create_issue == 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue_body = fs.readFileSync('schema_diff_issue.md', 'utf8');
            
            // Check if similar issue exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'api-schema-change'
            });
            
            if (issues.data.length > 0) {
              // Update existing issue
              const issue = issues.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '## 🔄 New Schema Changes Detected\n\n' + issue_body
              });
              console.log(`Updated existing issue #${issue.number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 API Schema Changes Detected',
                body: issue_body,
                labels: ['api-schema-change', 'breaking-change']
              });
              console.log('Created new issue');
            }
      
      - name: Notify on format changes
        if: |
          steps.compare.outputs.comparison_exit_code == '1' &&
          github.event_name == 'schedule'
        run: |
          echo "::warning::API schema has medium severity changes - review recommended"
      
      - name: Success notification
        if: steps.compare.outputs.comparison_exit_code == '0'
        run: |
          echo "✅ API schema is stable - no breaking changes detected"
